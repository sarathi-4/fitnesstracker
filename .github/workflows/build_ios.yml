name: Build iOS IPA (No Mac Required)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies & precache iOS
        run: |
          flutter precache --ios
          flutter pub get

      - name: Inject Google Maps API Key (from GitHub Secrets if set)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :GMSApiKey $MAPS_API_KEY" ios/Runner/Info.plist
            echo "Injected MAPS_API_KEY into Info.plist"
          else
            echo "MAPS_API_KEY secret not set; building with placeholder key"
          fi

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into JAIHIND_iOS.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r JAIHIND_iOS.ipa Payload
          ls -lh JAIHIND_iOS.ipa

      - name: Upload JAIHIND_iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAIHIND_iOS_IPA
          path: JAIHIND_iOS.ipa
          retention-days: 30
